<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f0e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Harbor">
  <title>Harbor — a calm guide for chronic pancreatitis</title>
  <meta name="description" content="A calm iPhone guide for chronic pancreatitis: flare steps, a long list of gentle foods, and green signals when the guide is working.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="stylesheet" href="./styles.css">
  <style>
    .boot { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 28px 20px; color: #1a2330; font-size: 20px; max-width: 480px; margin: 0 auto; }
    .boot h1 { font-size: 34px; line-height: 1.15; margin: 0 0 12px; }
    .boot a.fallback { display: block; background: #8f1828; color: #fff; text-align: center; padding: 16px; border-radius: 16px; text-decoration: none; font-weight: 700; margin-top: 16px; }
  </style>
</head>
<body>
  <div id="root">
    <div class="boot">
      <p style="letter-spacing:.08em;text-transform:uppercase;font-size:13px;font-weight:700;margin:0 0 8px;">Harbor</p>
      <h1>Opening your guide</h1>
      <p>If this screen stays, the guide did not start. If you are in severe pain, call for help.</p>
      <a class="fallback" href="tel:911">Call 911</a>
    </div>
  </div>
  <noscript>
    <div class="boot">
      <h1>Harbor needs JavaScript</h1>
      <p>This phone blocked the guide. If you are in severe pain, call for help.</p>
      <a class="fallback" href="tel:911">Call 911</a>
    </div>
  </noscript>
  <div id="live" class="sr" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
